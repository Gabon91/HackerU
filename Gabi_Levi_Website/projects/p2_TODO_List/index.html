<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="style/styles.css">
    <script src="script/app.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="navbar-brand">
            <img src="../../images/Gabi.jpg" alt="Gabi Levi">
            <span>Gabi Levi</span>
        </a>
        <ul class="navbar-links">
            <li><a href="../../index.html">ראשי</a></li>
            <li><a href="../../index.html#projects">פרויקטים</a></li>
            <li><a href="../../index.html#about">אודות</a></li>
            <li><a href="../../index.html#contact">צור קשר</a></li>
        </ul>
    </nav>

    <div class="skills-bar">
        <img src="../../images/HTML5_logo.png" alt="HTML5">
        <img src="../../images/CSS_logo.png" alt="CSS3">
        <img src="../../images/JS_logo.png" alt="JavaScript">
    </div>

    <section class="project-intro" id="project-intro">
        <h1>רשימת המשימות שלי</h1>
        <img src="images/Todo_list.png" alt="Tic Tac Toe" class="intro-img">
        <p class="intro-description">אפליקציה פשוטה לניהול משימות. הוסף משימה, סמן כהושלם וכד'. ניתן גם לייצא את הרשימה כקובץ טקסט.</p>
        <div class="intro-buttons">
            <a href="images/Tic_Tac_Toe.png" download class="btn btn-download">הורדה</a>
            <button class="btn btn-play" onclick="startGame()">שחק</button>
        </div>
    </section>


    <section class="todo-container" id="todo-container" style="display: none;">
        <h1>רשימת המשימות שלי</h1>

        <ul class="todo-list" id="todo-list">
        </ul>

        <div class="todo-actions">
            <button class="btn btn-add" id="add-task-btn">הוסף משימה</button>
            <button class="btn btn-export" id="export-btn">הורד כקובץ JSON</button>
            <button class="btn btn-import" id="import-btn">טען מקובץ JSON</button>
            <button class="btn btn-clear" id="clear-btn">נקה הכל</button>
        </div>
        <input type="file" id="file-input" accept=".json" style="display: none;">
    </section>

    <footer>
        <p>© 2026 גבי לוי</p>
    </footer>
</body>
</html>
