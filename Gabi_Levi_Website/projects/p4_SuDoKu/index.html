<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuDoKu</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="navbar-brand">
            <img src="../../images/Gabi.jpg" alt="Gabi Levi">
            <span>Gabi Levi</span>
        </a>
        <ul class="navbar-links">
            <li><a href="../../index.html">ראשי</a></li>
            <li><a href="../../index.html#projects">פרויקטים</a></li>
            <li><a href="../../index.html#about">אודות</a></li>
            <li><a href="../../index.html#contact">צור קשר</a></li>
        </ul>
    </nav>

    <div class="skills-bar">
        <img src="../../images/HTML5_logo.png" alt="HTML5">
        <img src="../../images/CSS_logo.png" alt="CSS3">
        <img src="../../images/JS_logo.png" alt="JavaScript">
    </div>

    <section class="project-intro" id="project-intro">
        <h1>SuDoKu</h1>
        <img src="images/Sudoku.png" alt="SuDoKu" class="intro-img">
        <p class="intro-description">משחק הסודוקו הקלאסי! מלאו את הלוח כך שכל שורה, עמודה וריבוע 3×3 יכילו את הספרות 1 עד 9 ללא חזרות. כמה מהר תצליחו לפתור?</p>
        <div class="intro-buttons">
            <a href="p4_SuDoKu.zip" download="p4_SuDoKu.zip" class="btn btn-download">הורדה</a>
            <button class="btn btn-play" onclick="startGame()">שחק</button>
        </div>
    </section>

    <section class="sudoku-container" id="game-container" style="display: none;">
        <div class="sudoku-header">
            <div class="info-box">
                <span class="info-label">זמן</span>
                <span class="info-value" id="timer">00:00</span>
            </div>
            <button class="btn btn-restart" id="restart-btn">משחק חדש</button>
        </div>
        <div class="sudoku-board" id="sudoku-board"></div>
        <div class="number-pad" id="number-pad">
            <button class="num-btn" data-num="1">1</button>
            <button class="num-btn" data-num="2">2</button>
            <button class="num-btn" data-num="3">3</button>
            <button class="num-btn" data-num="4">4</button>
            <button class="num-btn" data-num="5">5</button>
            <button class="num-btn" data-num="6">6</button>
            <button class="num-btn" data-num="7">7</button>
            <button class="num-btn" data-num="8">8</button>
            <button class="num-btn" data-num="9">9</button>
            <button class="num-btn erase-btn" data-num="0">✕</button>
        </div>
        <p class="controls-hint">בחרו תא ולאחר מכן לחצו על ספרה</p>
    </section>

    <footer>
        <p>© 2026 גבי לוי</p>
    </footer>

    <script src="script/app.js"></script>
</body>
</html>
