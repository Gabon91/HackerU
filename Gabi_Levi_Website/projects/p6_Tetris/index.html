<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="navbar-brand">
            <img src="../../images/Gabi.jpg" alt="Gabi Levi">
            <span>Gabi Levi</span>
        </a>
        <ul class="navbar-links">
            <li><a href="../../index.html">ראשי</a></li>
            <li><a href="../../index.html#projects">פרויקטים</a></li>
            <li><a href="../../index.html#about">אודות</a></li>
            <li><a href="../../index.html#contact">צור קשר</a></li>
        </ul>
    </nav>

    <div class="skills-bar">
        <img src="../../images/HTML5_logo.png" alt="HTML5">
        <img src="../../images/CSS_logo.png" alt="CSS3">
        <img src="../../images/JS_logo.png" alt="JavaScript">
    </div>

    <section class="project-intro" id="project-intro">
        <h1>Tetris</h1>
        <img src="images/Tetris.png" alt="Tetris" class="intro-img">
        <p class="intro-description">משחק הטטריס הקלאסי! סדרו את הצורות היורדות כדי ליצור שורות שלמות. ככל שתתקדמו, המשחק יהפוך מהיר יותר. כמה נקודות תצליחו לצבור?</p>
        <div class="intro-buttons">
            <a href="p6_Tetris.zip" download="p6_Tetris.zip" class="btn btn-download">הורדה</a>
            <button class="btn btn-play" onclick="startGame()">שחק</button>
        </div>
    </section>

    <section class="tetris-container" id="game-container" style="display: none;">
        <div class="game-layout">
            <div class="info-panel">
                <div class="info-box">
                    <span class="info-label">ניקוד</span>
                    <span class="info-value" id="score">0</span>
                </div>
                <div class="info-box">
                    <span class="info-label">זמן</span>
                    <span class="info-value" id="timer">00:00</span>
                </div>
                <div class="info-box">
                    <span class="info-label">שורות</span>
                    <span class="info-value" id="lines">0</span>
                </div>
                <div class="info-box">
                    <span class="info-label">רמה</span>
                    <span class="info-value" id="level">1</span>
                </div>
                <button class="btn btn-restart" id="restart-btn">התחל מחדש</button>
            </div>
            <canvas id="tetris-canvas" width="300" height="600"></canvas>
        </div>
        <p class="controls-hint">⬅➡ הזז | ⬆ סובב | ⬇ האץ | רווח - הפל</p>
    </section>

    <footer>
        <p>© 2026 גבי לוי</p>
    </footer>

    <script src="script/app.js"></script>
</body>
</html>
