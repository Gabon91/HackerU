<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גבי - הפרויקטים שלי</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2f;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 20px 10px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            color: #aaa;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            padding: 40px 20px 60px;
            max-width: 1000px;
            width: 100%;
        }

        .project-card {
            text-decoration: none;
            color: inherit;
            background-color: #2c2c3e;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-color: #4caf50;
        }

        .project-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background-color: #3a3a50;
        }

        .project-card .card-label {
            text-align: center;
            padding: 14px 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            margin-top: auto;
        }

        /* Tablet – 2 columns */
        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile – 1 column */
        @media (max-width: 480px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>הפרויקטים שלי</h1>
        <p>לחצו על פרויקט כדי לצפות בו</p>
    </header>

    <main class="projects-grid">
        <a href="project-1.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+1" alt="פרויקט 1">
            <div class="card-label">פרויקט 1</div>
        </a>
        <a href="project-2.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+2" alt="פרויקט 2">
            <div class="card-label">פרויקט 2</div>
        </a>
        <a href="project-3.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+3" alt="פרויקט 3">
            <div class="card-label">פרויקט 3</div>
        </a>
        <a href="project-4.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+4" alt="פרויקט 4">
            <div class="card-label">פרויקט 4</div>
        </a>
        <a href="project-5.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+5" alt="פרויקט 5">
            <div class="card-label">פרויקט 5</div>
        </a>
        <a href="project-6.html" class="project-card">
            <img src="https://via.placeholder.com/300x200/3a3a50/ffffff?text=PROJECT+6" alt="פרויקט 6">
            <div class="card-label">פרויקט 6</div>
        </a>
    </main>

    <footer>
        <p>© 2026 גבי לוי</p>
    </footer>

</body>
</html>
